name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Only the light core + dev tools: unit tests need no torch, models or services
      # (the Gradio extra is light too: its smoke test uses demo data).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web,gradio]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src

      - name: Unit tests
        run: python -m pytest tests/unit --cov=tubitak_rag --cov-report=xml --cov-report=term --cov-fail-under=0
