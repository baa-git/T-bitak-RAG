# ------------------------------------------------------------ Parçalama
- id: FR-C1
  kat: C
  tip: Her zaman
  ihtiyac: "Sistem, sabit pencereli parçalamada parça boyutunun ve örtüşmenin token cinsinden yapılandırılmasına izin vermelidir."
  kabul: "512 token / 64 örtüşme ile üretilen parçalar bu sınırlara uyar; örtüşme boyuttan küçük olmalıdır."
  oncelik: Zorunlu
  dogrulama: Test
  durum: Karşılandı
  kanit: "chunking/fixed.py; test_fixed.py::test_windows_respect_size_and_overlap, ::test_rejects_overlap_not_smaller_than_size; v0/v0r: 4.193 parça."
- id: FR-C2
  kat: C
  tip: Opsiyonel
  ihtiyac: "Yapı bazlı parçalama etkinleştirildiğinde, sistem her maddeyi, her HTML bölümünü ve her SSS soru-cevap çiftini ayrı bir parça olarak üretmelidir."
  kabul: "Uzunluk eşiğini aşan madde fıkra sınırlarından bölünür, hiçbir fıkra ortadan kesilmez; bir SSS çifti tek parçadadır."
  oncelik: Zorunlu
  dogrulama: Test
  durum: Karşılandı
  kanit: "chunking/structural.py; test_structural.py::test_each_article_is_one_chunk, ::test_long_article_split_at_paragraph_boundaries, ::test_faq_pair_single_chunk, ::test_html_sections_separate_chunks; v1–v3b: 7.017 parça."
- id: FR-C6
  kat: C
  tip: Opsiyonel
  ihtiyac: "Bağlam başlığı seçeneği etkinleştirildiğinde, sistem her parçanın embed edilen metninin başına belge ve hiyerarşi bilgisini eklemelidir."
  kabul: "embed_text 'Belge › Bölüm › Madde N – Başlık' satırıyla başlar; kullanıcıya gösterilen text değişmez."
  oncelik: Zorunlu
  dogrulama: Test
  durum: Karşılandı
  kanit: "chunking/context_header.py; test_structural.py::test_embed_text_starts_with_doc_and_hierarchy, ::test_text_unchanged_when_header_on, ::test_same_title_different_program_yields_different_embed_text."

# ------------------------------------------------------------ İndeksleme
- id: FR-I2
  kat: I
  tip: Olay
  ihtiyac: "Corpus'ta bir belge eklendiğinde, değiştiğinde veya silindiğinde, sistem yalnızca o belgenin dense ve BM25 indeks kayıtlarını güncellemelidir."
  kabul: "Diğer belgelerin embedding'leri yeniden hesaplanmaz; silinen belgenin parçaları aramada dönmez; ikinci ingest hiçbir şey değiştirmez."
  oncelik: Zorunlu
  dogrulama: Test
  durum: Karşılandı
  kanit: "indexing/sync.py; test_sync.py::test_apply_only_embeds_changed_docs, ::test_apply_update_replaces_chunks, ::test_apply_remove_deletes; test_ingest.py::test_ingest_removes_deleted_doc_from_both_indexes."
- id: FR-X9
  kat: I
  tip: Durum
  ihtiyac: "Bir belgenin içeriği ve işlem ayarları değişmemişken, sistem ayrıştırma, parçalama ve embedding sonuçlarını önbellekten yeniden kullanmalıdır."
  kabul: "İkinci ingest ayrıştırma ve embedding adımlarını atlar; önbellek model adına göre ayrıdır."
  oncelik: Zorunlu
  dogrulama: Test
  durum: Karşılandı
  kanit: "test_ingest.py::test_second_ingest_is_noop_and_skips_parse_and_embed, ::test_full_flag_rebuilds_everything_from_the_caches; test_embedding_cache.py::test_lookup_is_per_model; ölçüm: önbellekli ingest 23 s (7.017 parça)."

