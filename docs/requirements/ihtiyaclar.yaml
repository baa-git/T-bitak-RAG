# TÜBİTAK Mevzuat RAG — İhtiyaç listesi (tek kaynak)
#
# Bu dosya ihtiyaçların TEK kaynağıdır. Excel (docs/ihtiyaclar.xlsx) ve
# Markdown tablosu `python docs/requirements/build.py` ile buradan üretilir.
#
# İhtiyaçlar aracı kullanan kişilerin bakışıyla yazılır:
#   - TÜBİTAK başvurusu ve mevzuatı hakkında soru soran kişi,
#   - teknikleri karşılaştırarak RAG öğrenen geliştirici,
#   - aracı Docker ile ya da Hugging Face Space'te çalıştıran kişi,
#   - koda katkıda bulunan geliştirici.
# Geliştirme süreci (günlük, review, commit düzeni) ihtiyaç değildir.
#
# Cümle kuralı (EARS kalıbı, Türkçe):
#   Her zaman      : "<Özne>, <nesne> <eylem>-malıdır/-melidir."
#   Olay           : "<Olay> -dığında/-diğinde, <özne> ... -malıdır."
#   Durum          : "<Durum> iken, <özne> ... -malıdır."
#   İstenmeyen     : "<İstenmeyen durum> durumunda, <özne> ... -malıdır."
#   Opsiyonel      : "<Özellik> etkinleştirildiğinde, <özne> ... -malıdır."
# Her ihtiyaç tek bir yükümlülük içerir ve "-malıdır/-melidir" ile biter.
#
# durum: Bekliyor | Karşılandı | Kısmi | Karşılanmadı | Kapsam dışı
#   (Bekliyor = üzerinde çalışılıyor / henüz doğrulanamadı)
# oncelik: Zorunlu | Önemli | İsteğe bağlı
# dogrulama: Test | Gösterim | İnceleme | Analiz
# kanit: dosya yolu, test adı (dosya::test) veya ölçülen sonuç. Durumlar 2026-10-21'de
#   kod, testler (pytest tests/unit: 1520 geçti, 12 bilinen açık strict xfail, kapsam %98) ve
#   docs/sample-reports/ sonuçlarıyla doğrulandı.

