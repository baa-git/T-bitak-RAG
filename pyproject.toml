[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubitak-rag"
version = "1.0.0"
description = "Türkçe TÜBİTAK/Ar-Ge mevzuatı için öğretici, modüler RAG uygulaması"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.7", "pyyaml>=6", "python-dotenv>=1", "typer>=0.12", "httpx>=0.27",
  "pdfplumber>=0.11", "beautifulsoup4>=4.12", "openpyxl>=3.1",
  "bm25s>=0.2", "snowballstemmer>=2.2", "qdrant-client>=1.12", "numpy>=1.26",
]

[project.optional-dependencies]
ml = ["torch>=2.6", "torchvision>=0.21", "sentence-transformers>=6.1.0", "transformers>=4.50", "tokenizers>=0.20"]
api = ["anthropic>=1.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "markdown>=3.6"]
# Hugging Face ZeroGPU Space; locally `spaces` is optional (the GPU decorator is then a no-op).
gradio = ["gradio>=6.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "types-PyYAML", "fpdf2>=2.7"]

[project.scripts]
rag = "tubitak_rag.interfaces.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tubitak_rag = [
  "interfaces/web/templates/**/*.html",
  "interfaces/web/static/**/*",
  "interfaces/gradio_app/*.css",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [
  # Pre-existing one-off corpus/requirements scripts (written before the package existed).
  "tools/corpus/crawl_programs.py",
  "tools/corpus/download_programs.py",
  "tools/corpus/fetch_mevzuat.py",
  "docs/requirements/build.py",
  "docs/requirements/build_tests.py",
  # Markdown code blocks in docs are illustrative signatures, not formatted source.
  "*.md",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["tubitak_rag", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.mypy]
python_version = "3.13"
packages = ["tubitak_rag"]
mypy_path = "src"
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: gerçek servis (Qdrant/Ollama/model) gerektirir"]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["tubitak_rag"]
omit = [
  "src/tubitak_rag/adapters/*",
  "src/tubitak_rag/interfaces/warmup.py",
]
